[project]
name = "dental-ai-backend"
version = "0.1.0"
description = "Dental Autonomous Solo Lab OS Backend & FastMCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "fastmcp>=2.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "prisma>=0.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "trimesh>=4.1.0",
    "open3d>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "fpdf2>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "watchdog>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "isort>=5.13.0",
    "mypy>=1.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
